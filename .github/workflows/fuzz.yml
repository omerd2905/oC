name: oC nightly fuzz

# The fuzzer (tools/fuzz) with a fresh seed and a larger budget than `make fuzz`. A failure
# uploads the minimized findings; add each one to tests/fuzz_regressions/ once it is fixed.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz (arena lifetimes + C/native differential)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build occ from the bootstrap
        run: cc -O2 bootstrap/occ_bootstrap.c -o bin/occ

      - name: Fuzz 10000 programs per mode
        run: python3 tools/fuzz/run.py --budget 10000 --seed "$(date +%s)"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-findings/
